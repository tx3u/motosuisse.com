sonar.projectKey=motosuisse
sonar.host.url=http://localhost:9000
sonar.projectName=MotoSuisse
sonar.projectVersion=1.0

# Sources
sonar.sources=backend/src
sonar.exclusions=\
  **/node_modules/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/prisma/migrations/**

# TypeScript
sonar.typescript.tsconfigPath=backend/tsconfig.json

# Tests & coverage (backend)
sonar.tests=backend/src
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Exclude bootstrap/infrastructure files from coverage (no business logic)
sonar.coverage.exclusions=**/main.ts,**/*.module.ts

# Encoding
sonar.sourceEncoding=UTF-8
